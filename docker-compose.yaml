services:
  web:
    image: ${CODESTRA_BACKEND_IMAGE:-codestra-backend:local}
    build: .
    restart: unless-stopped
    init: true
    env_file:
      - .env
    ports:
      - "127.0.0.1:${WEB_PORT:-9000}:8000"
    volumes:
      - static_data:/app/static
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  celery:
    image: ${CODESTRA_BACKEND_IMAGE:-codestra-backend:local}
    build: .
    command: celery -A CORE.celery_app worker --loglevel=INFO
    restart: unless-stopped
    init: true
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  celery_beat:
    image: ${CODESTRA_BACKEND_IMAGE:-codestra-backend:local}
    build: .
    command: celery -A CORE.celery_app beat --scheduler=django_celery_beat.schedulers:DatabaseScheduler --loglevel=INFO
    restart: unless-stopped
    init: true
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASS:?set POSTGRES_PASS}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  static_data:
  media_data:
  postgres_data:
  redis_data:
